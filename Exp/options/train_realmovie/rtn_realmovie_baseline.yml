# ==============================================================================
# RTN GAN 老电影修复训练配置
# ==============================================================================
# 基于 BasicSR 框架的视频修复 GAN 模型配置
# 支持 RAFT/SpyNet/MemFlow 光流估计，Swin Transformer 空间修复
# ==============================================================================
#
# 训练命令示例：
# CUDA_VISIBLE_DEVICES=0 python train.py -opt options/train/rtn_baseline/rtn_baseline.yml --debug
#

# ======================== 基础配置 ========================
name: rtn_realmovie_baseline               # 实验名称，用于保存模型和日志
model_type: RTNGANModel               # 模型类型：RTNGANModel（GAN训练）
scale: 1                              # 上采样倍数（1表示不上采样，保持原分辨率）
num_gpu: 1                            # GPU 数量（单卡训练设为1）
manual_seed: 2021                     # 随机种子，保证实验可复现
dist: false                           # 分布式训练开关（单卡设为false）
find_unused_parameters: true          # DDP 参数检查（光流模块可能未使用）

# ======================== 数据集配置 ========================
datasets:
  # -------------------- 训练集 --------------------
  train:
    name: REDS                        # 数据集名称（用于日志显示）
    type: Film_dataset_1              # 数据集类型（REDS格式）

    # 数据路径（训练时GT和LQ路径相同，由降质模块生成LQ）
    dataroot_gt: datasets/RealMovieDatasets/RealMovies/RealMovie/TrainDatasets/GT
    dataroot_lq: datasets/RealMovieDatasets/RealMovies/RealMovie/TrainDatasets/GT

    is_train: true                    # 训练模式标记
    num_frame: 7                      # 每次采样的帧数（建议奇数，便于中心帧对齐）
    gt_size: [256, 256]               # 随机裁剪尺寸 [宽, 高]
    scale: 1                          # 数据集缩放倍数

    # 时序增强配置
    interval_list: [1, 2]             # 帧间隔列表（随机选择，增加时序多样性）
    random_reverse: false             # 随机反向播放（增加数据增强）

    # 空间增强配置
    use_flip: true                    # 随机水平/垂直翻转
    use_rot: true                     # 随机90度旋转

    # 归一化配置（重要！）
    normalizing: true                 # 启用归一化到 [-1, 1]（网络输出tanh激活）

    # 降质模板路径（老电影噪声、划痕等纹理）
    texture_template: datasets/OldFilmRestoration/noise_data

    # 数据加载配置
    io_backend:
      type: disk                      # 数据读取方式：disk/lmdb
    use_shuffle: true                 # 打乱数据顺序
    num_worker_per_gpu: 4             # 每个GPU的数据加载线程数
    batch_size_per_gpu: 1             # 每个GPU的批大小（显存不足时减小）
    dataset_enlarge_ratio: 1          # 数据集扩大倍数（重复采样）

  # -------------------- 验证集 --------------------
  val:
    name: OldFilmval                  # 验证集名称
    type: Film_dataset_1              # 数据集类型

    # 验证数据路径（GT和LQ分开存放）
    dataroot_gt: datasets/RealMovieDatasets/RealMovies/RealMovie/ValDatasets_mini/GT
    dataroot_lq: datasets/RealMovieDatasets/RealMovies/RealMovie/ValDatasets_mini/LQ

    num_frame: -1                     # 验证时使用的帧数（-1表示使用全部帧）
    cache_data: false                  # 缓存验证数据到内存（加速验证）
    normalizing: true                 # 归一化配置（需与训练保持一致）

    io_backend:
      type: disk

# ======================== 网络架构配置 ========================
# -------------------- 生成器 G --------------------
network_g:
  type: RTNRestorationNet             # 架构类型（RTN + Swin 空间模块）
  num_feat: 16                        # original paper config (CVPR 2022)
  num_block: 6                        # 残差块数量
  flow_type: raft                     # 光流估计器类型: raft / spynet / memflow
                                      # - raft: 精度高，速度慢，显存大
                                      # - spynet: 速度快，显存小，精度略低
                                      # - memflow: 长序列优化，显存友好

# -------------------- 判别器 D --------------------
network_d:
  type: RTNDiscriminator              # 判别器类型
  in_channels: 3                      # 输入通道数（RGB）
  base_channels: 64                   # 基础通道数
  use_sigmoid: false                  # 输出层是否使用Sigmoid（NSGAN不使用）
  use_spectral_norm: true             # 谱归一化（稳定GAN训练）

# ======================== 训练配置 ========================
train:
  # -------------------- EMA 配置 --------------------
  ema_decay: 0.0                      # 指数移动平均衰减（0表示不使用EMA）

  # -------------------- 可视化配置 --------------------
  train_visualization_iter: 1000      # 每 N 次迭代保存训练可视化图像
                                      # 生成 GT/LQ/Output 对比图，便于监控训练

  # -------------------- GAN 训练配置 --------------------
  net_d_iters: 1                      # 每次G更新时D的更新次数
  net_d_init_iters: 0                 # 训练初期仅训练D的迭代数
  g_gan_weight: 0.01                  # 生成器对抗损失权重
  d_gan_weight: 1.0                   # 判别器损失权重

  # -------------------- 高级训练配置（可选）--------------------
  # accumulation_steps: 1             # 梯度累积步数（增大等效batch_size）
  # use_amp: false                    # 混合精度训练（减少显存，可能影响精度）

  # -------------------- 优化器配置 --------------------
  total_epoch: 20                     # epoch-based 训练（与 MambaOFR 原版一致）

  optim_g:                            # 生成器优化器
    type: Adam                        # 优化器类型: Adam / AdamW
    lr: !!float 0.0002                # 学习率
    betas: [0.9, 0.99]                # Adam动量参数

  optim_d:                            # 判别器优化器
    type: Adam
    lr: !!float 0.0002
    betas: [0.9, 0.99]

  # -------------------- 损失函数配置 --------------------
  pixel_opt:                          # 像素级损失
    type: L1Loss                      # L1损失（对噪声鲁棒）
    loss_weight: 1.0                  # 损失权重
    reduction: mean                   # 归约方式

  perceptual_opt:                     # 感知损失（VGG特征匹配）
    type: VGGLoss                     # 多层VGG特征损失
    loss_weight: 1.0                  # 损失权重

  gan_opt:                            # 对抗损失
    type: AdversarialLoss             # 对抗损失类型
    loss_type: nsgan                  # MambaOFR 原版使用 hinge
    loss_weight: 1.0                  # 损失权重（实际权重 = loss_weight * g_gan_weight）

  # -------------------- 学习率调度 --------------------
  scheduler:
    type: LinearDecayLR               # 线性衰减（与 MambaOFR 一致）
    total_iter: -1                    # 自动从 total_epoch 计算
    steady_ratio: 0.5                 # 前 50% epoch 恒定，后 50% 线性衰减到 0

# ======================== 验证配置 ========================
val:
  val_freq: !!float 5000              # 验证频率（每 N 次迭代验证一次）
  save_img: false                      # 是否保存验证结果图像
  val_chunk_size: -1                # 验证推理分块大小（长视频分块处理避免OOM，-1不分块）
                                      # 注：验证数据集帧数由 datasets.val.num_frame 控制

  # 评价指标配置
  metrics:
    psnr:                             # PSNR 指标
      type: calculate_psnr
      crop_border: 0                  # 裁剪边缘像素数（避免边缘伪影影响）
      test_y_channel: false           # 是否仅计算Y通道
    ssim:                             # SSIM 指标
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

# ======================== 日志配置 ========================
logger:
  print_freq: 100                     # 日志打印频率（每 N 次迭代）
  save_checkpoint_freq: !!float 5000  # 模型保存频率
  use_tb_logger: true                 # 是否使用 TensorBoard

# ======================== 路径配置 ========================
# ⚠️ experiments_root 和 tb_logger 为占位符，由 codegen 脚本自动替换为项目路径。
# 正确值形如: projects/{NNN}-{project}/Exp/experiments
# 直接使用本模板训练将因路径不存在而报错（这是有意为之的安全措施）。
path:
  experiments_root: baselines/trained/rtn_realmovie/experiments   # ← codegen 自动替换
  tb_logger: baselines/trained/rtn_realmovie/tb_logger            # ← codegen 自动替换
  pretrain_network_g: ~
  strict_load_g: true               # 预训练生成器路径（~表示从头训练）
  pretrain_network_d: ~               # 预训练判别器路径
  resume_state: ~                     # 断点续训状态文件路径
