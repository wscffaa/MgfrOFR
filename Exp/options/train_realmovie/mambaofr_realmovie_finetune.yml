# ==============================================================================
# MambaOFR GAN 老电影修复训练配置
# ==============================================================================
# 基于 MambaOFR (Mamba Old Film Restoration) 的视频修复 GAN 模型配置
# MambaOFR 是 RTN 的 Mamba 状态空间模型变体，特点：
# - MambaIR 空间修复模块（替代 Swin Transformer）
# - DCNv2 流引导对齐
# - pre_mask 传播机制增强时序一致性
#
# 基于 rtn_baseline.yml 模板，仅修改 name 和 network_g 部分
# ==============================================================================
#
# 训练命令示例：
# CUDA_VISIBLE_DEVICES=0 python train.py -opt options/train/mambaofr/mambaofr_baseline.yml --debug
#

# ======================== 基础配置 ========================
name: mambaofr_realmovie_finetune          # ← 修改：实验名称
model_type: RTNGANModel               # 模型类型（复用 RTN 的训练逻辑）
scale: 1                              # 上采样倍数
num_gpu: 1                            # GPU 数量
manual_seed: 2021                     # 随机种子
dist: false                           # 分布式训练
find_unused_parameters: true          # DDP 参数检查

# ======================== 数据集配置 ========================
# 与 rtn_baseline.yml 完全一致，确保公平对比
datasets:
  # -------------------- 训练集 --------------------
  train:
    name: REDS
    type: Film_dataset_1

    # 数据路径
    dataroot_gt: datasets/RealMovieDatasets/RealMovies/RealMovie/TrainDatasets/GT
    dataroot_lq: datasets/RealMovieDatasets/RealMovies/RealMovie/TrainDatasets/GT

    is_train: true
    num_frame: 7                      # 每次采样的帧数
    gt_size: [256, 256]               # 随机裁剪尺寸
    scale: 1

    # 时序增强
    interval_list: [1, 2]
    random_reverse: false

    # 空间增强
    use_flip: true
    use_rot: true

    # 归一化
    normalizing: true

    # 降质模板路径
    texture_template: datasets/OldFilmRestoration/noise_data

    # 数据加载
    io_backend:
      type: disk
    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 1
    dataset_enlarge_ratio: 1

  # -------------------- 验证集 --------------------
  val:
    name: OldFilmval
    type: Film_dataset_1

    dataroot_gt: datasets/RealMovieDatasets/RealMovies/RealMovie/ValDatasets_mini/GT
    dataroot_lq: datasets/RealMovieDatasets/RealMovies/RealMovie/ValDatasets_mini/LQ

    num_frame: -1
    cache_data: false
    normalizing: true

    io_backend:
      type: disk

# ======================== 网络架构配置 ========================
# -------------------- 生成器 G (MambaOFR) --------------------
# ← 修改：MambaOFR 特有配置
network_g:
  type: MambaOFRNet                    # ← 修改：MambaOFR 架构
  num_feat: 16                         # original paper config (CVPR 2025)
  use_checkpoint: false                # 原始论文无 gradient checkpointing
  num_block: 6                         # 残差块数量（与 RTN 一致）
  flow_type: raft                      # 光流估计器（与 RTN 一致）

  # MambaIR 特有参数（← 新增）
  mamba_embed_dim: 64                  # MambaIR 嵌入维度
  mamba_depths: [2, 2, 2]              # MambaIR 各层深度
  mamba_d_state: 16                    # MambaIR 状态维度
  mamba_mlp_ratio: 1.2                 # MambaIR MLP 扩展比
  mamba_drop_path: 0.1                 # MambaIR DropPath 率（原始 MambaOFR 默认值，与已训练 baseline 一致）

# -------------------- 判别器 D --------------------
# 与 rtn_baseline.yml 完全一致
network_d:
  type: RTNDiscriminator
  in_channels: 3
  base_channels: 64
  use_sigmoid: false
  use_spectral_norm: true

# ======================== 训练配置 ========================
# 与 rtn_baseline.yml 完全一致，确保公平对比
train:
  # EMA 配置
  ema_decay: 0.0

  # 可视化配置
  train_visualization_iter: 1000

  # GAN 训练配置
  net_d_iters: 1
  net_d_init_iters: 0
  g_gan_weight: 0.01
  d_gan_weight: 1.0

  # -------------------- Early Stopping 配置 --------------------
  # 默认关闭：GAN 训练中 PSNR 波动大（判别器推动感知质量而非像素精度），
  # 基于 PSNR 的早停容易误停。消融实验建议跑满 total_iter 保证公平对比。
  # save_best 不依赖 ES enabled，始终生效。
  # 如需启用，建议 metric=ssim（更稳定）+ patience>=12。

  # 优化器配置（iter-based，200K iters 与原论文一致）
  total_iter: 200000

  optim_g:
    type: Adam
    lr: !!float 0.0001
    betas: [0.9, 0.99]

  optim_d:
    type: Adam
    lr: !!float 0.0001
    betas: [0.9, 0.99]

  # 损失函数配置
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

  perceptual_opt:
    type: VGGLoss
    loss_weight: 1.0

  gan_opt:
    type: AdversarialLoss
    loss_type: nsgan                    # MambaOFR 原版使用 hinge
    loss_weight: 1.0

  # 学习率调度（线性衰减，与 MambaOFR nepoch_steady=10 + nepoch_decay=10 一致）
  scheduler:
    type: LinearDecayLR
    total_iter: 200000                  # 与原论文一致
    steady_ratio: 0.5                   # 前 100K 恒定，后 100K 线性衰减到 0

# ======================== 验证配置 ========================
# 与 rtn_baseline.yml 完全一致
val:
  val_freq: !!float 5000
  save_img: false
  val_chunk_size: -1

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

# ======================== 日志配置 ========================
# 与 rtn_baseline.yml 完全一致
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5000
  use_tb_logger: true

# ======================== 路径配置 ========================
# ⚠️ experiments_root 和 tb_logger 为占位符，由 codegen 脚本自动替换为项目路径。
# 正确值形如: projects/{NNN}-{project}/Exp/experiments
# 直接使用本模板训练将因路径不存在而报错（这是有意为之的安全措施）。
path:
  experiments_root: baselines/trained/mambaofr_realmovie/experiments   # ← codegen 自动替换
  tb_logger: baselines/trained/mambaofr_realmovie/tb_logger            # ← codegen 自动替换
  pretrain_network_g: pretrained/mambaofr_reds_16_net_g_best.pth  # centralized canonical baseline (num_feat=16)
  strict_load_g: true
  pretrain_network_d: ~
  resume_state: ~
