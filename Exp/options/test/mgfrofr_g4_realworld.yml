name: mgfrofr_g4_realworld
model_type: MGFROFRModel
scale: 1
num_gpu: 1
manual_seed: 2021
dist: false
find_unused_parameters: true
datasets:
  test:
    name: RealFilm_SRWOV
    type: Film_SRWOV_dataset
    dataroot_lq: datasets/OldFilmRestoration/val/RealFilm/MambaOFR_SRWOV
    num_frame: -1
    cache_data: false
    normalizing: true
    io_backend:
      type: disk
network_g:
  type: MgfrOFR
  num_feat: 16
  num_block: 6
  flow_type: raft
  use_checkpoint: false
  mamba_embed_dim: 64
  mamba_depths:
  - 2
  - 2
  - 2
  mamba_d_state: 16
  mamba_mlp_ratio: 1.2
  mamba_drop_path: 0.0
  use_mgfe: true
  mgfe_num_tokens: 12
  mgfe_num_branches: 4
  mgfe_token_fusion: max
val:
  save_img: true
  metrics: null
logger:
  print_freq: 100
path:
  pretrain_network_g: Exp/experiments/mgfrofr_g4/models/net_g_155000.pth
  results_root: Exp/results_best_g4
  results_subdir: mgfrofr_g4_realworld
