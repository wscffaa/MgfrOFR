name: mgfrofr_f1_oldfilmtest_teaser_valbest
model_type: RTNGANModel
scale: 1
num_gpu: 1
manual_seed: 2021
dist: false
find_unused_parameters: true

datasets:
  test:
    name: OldFilmTest
    type: Film_SRWOV_dataset
    dataroot_lq: datasets/val/RealFilm/OldFilmTest
    num_frame: -1
    cache_data: false
    normalizing: true
    grayscale: true
    align: 16
    io_backend:
      type: disk

network_g:
  type: MgfrOFR
  num_feat: 16
  num_block: 6
  flow_type: raft
  use_checkpoint: false
  mamba_embed_dim: 64
  mamba_depths: [2, 2, 2]
  mamba_d_state: 16
  mamba_mlp_ratio: 1.2
  mamba_drop_path: 0.0
  use_mgfe: true
  mgfe_num_tokens: 12
  mgfe_num_branches: 3
  mgfe_token_fusion: avg

val:
  save_img: true
  val_chunk_size: 2
  metrics: null

logger:
  print_freq: 100

path:
  pretrain_network_g: Exp/experiments/mgfrofr_f1_avg/models/net_g_80000.pth
  results_root: Exp/results
