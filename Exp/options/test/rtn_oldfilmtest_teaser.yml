name: rtn_oldfilmtest_teaser
model_type: RTNGANModel
scale: 1
num_gpu: 1
manual_seed: 2021
dist: false
find_unused_parameters: true

datasets:
  test:
    name: OldFilmTest
    type: Film_SRWOV_dataset
    dataroot_lq: datasets/val/RealFilm/OldFilmTest
    num_frame: -1
    cache_data: false
    normalizing: true
    grayscale: true
    align: 16
    io_backend:
      type: disk

network_g:
  type: RTNRestorationNet
  num_feat: 16
  num_block: 6
  flow_type: raft

val:
  save_img: true
  val_chunk_size: 2
  metrics: null

logger:
  print_freq: 100

path:
  pretrain_network_g: baselines/pretrained_model/rtn/net_g_latest_converted.pth
  results_root: Exp/results
