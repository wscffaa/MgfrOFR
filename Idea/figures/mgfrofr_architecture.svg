<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     font-family="Arial, Helvetica, 'Source Sans Pro', sans-serif">
  <title>MGFROFR Architecture Overview (Idea-phase blueprint)</title>
  <desc>
    Pipeline overview for projects/001-reidmamba (MGFROFR = MambaOFR baseline + MGFE module + RATR training loss).
    Elements: Input clip, RAFT flow + warp, bidirectional Mamba propagation (forward + backward),
    MGFE multi-granularity feature extractor on both paths, RATR training-only auxiliary loss,
    reconstruction head, output clip. This SVG is the Idea-phase blueprint referenced by
    Idea/06-¹Õ×²ã.md §3 and Idea/ablation_matrix.json (A0..A3 + G1/G2).
    Colors: gray=baseline carryover, blue=input, orange=MGFE (novel primary),
    red=RATR (novel secondary, training only), green=output.
  </desc>

  <defs>
    <!-- solid arrow for main flow -->
    <marker id="arrow-solid" viewBox="0 0 12 12" refX="10" refY="6"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#2F3A4A"/>
    </marker>
    <!-- dashed arrow (training only) -->
    <marker id="arrow-dashed" viewBox="0 0 12 12" refX="10" refY="6"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#E95A5A"/>
    </marker>
  </defs>

  <!-- ===== background ===== -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- ===== title strip ===== -->
  <text x="640" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1E2634">
    MGFROFR  Multi-Granularity Feature Restoration for Old Film Restoration
  </text>
  <text x="640" y="64" text-anchor="middle" font-size="13" fill="#4B5666">
    Baseline: MambaOFRNet · Novel modules: MGFE (spatial body) + RATR (training-only loss)
  </text>

  <!-- ===== band labels ===== -->
  <text x="80" y="130" font-size="13" fill="#6B7280" font-style="italic">Spatial pipeline</text>
  <text x="80" y="330" font-size="13" fill="#6B7280" font-style="italic">Temporal pipeline (bidirectional)</text>
  <text x="80" y="570" font-size="13" fill="#E95A5A" font-style="italic">Training-only auxiliary path</text>

  <!-- ===== INPUT strip (left) ===== -->
  <g id="input-group">
    <rect x="60" y="310" width="130" height="120" rx="10" ry="10"
          fill="#EAF2FC" stroke="#4A90E2" stroke-width="2"/>
    <!-- three mini frame rectangles -->
    <rect x="76"  y="330" width="30" height="80" fill="#B4C7E0" stroke="#4A90E2"/>
    <rect x="113" y="330" width="30" height="80" fill="#9BB4D3" stroke="#4A90E2"/>
    <rect x="150" y="330" width="30" height="80" fill="#B4C7E0" stroke="#4A90E2"/>
    <!-- scratches marks -->
    <line x1="80"  y1="345" x2="100" y2="395" stroke="#2F3A4A" stroke-width="1" opacity="0.5"/>
    <line x1="120" y1="340" x2="138" y2="400" stroke="#2F3A4A" stroke-width="1" opacity="0.5"/>
    <line x1="155" y1="355" x2="175" y2="400" stroke="#2F3A4A" stroke-width="1" opacity="0.5"/>
    <text x="125" y="450" text-anchor="middle" font-size="12" fill="#1E2634" font-weight="600">Input clip</text>
    <text x="125" y="466" text-anchor="middle" font-size="10" fill="#4B5666">(B, T, C, H, W)</text>
    <text x="125" y="480" text-anchor="middle" font-size="10" fill="#4B5666">degraded film</text>
  </g>

  <!-- ===== SPATIAL band: 2D SSM backbone (carry-over) ===== -->
  <g id="spatial-group">
    <rect x="290" y="110" width="200" height="90" rx="10" ry="10"
          fill="#F2F4F7" stroke="#B0B7C3" stroke-width="2"/>
    <text x="390" y="145" text-anchor="middle" font-size="14" fill="#1E2634" font-weight="600">2-D SSM block</text>
    <text x="390" y="165" text-anchor="middle" font-size="11" fill="#4B5666">MambaIR body (baseline)</text>
    <text x="390" y="182" text-anchor="middle" font-size="10" fill="#6B7280" font-style="italic">num_block=6, embed_dim=64</text>
  </g>

  <!-- ===== RAFT Flow (between input and temporal band) ===== -->
  <g id="flow-group">
    <rect x="230" y="230" width="130" height="60" rx="8" ry="8"
          fill="#F2F4F7" stroke="#B0B7C3" stroke-width="2"/>
    <text x="295" y="255" text-anchor="middle" font-size="13" fill="#1E2634" font-weight="600">RAFT flow</text>
    <text x="295" y="272" text-anchor="middle" font-size="10" fill="#6B7280" font-style="italic">(B, T-1, 2, H, W)</text>
  </g>

  <!-- ===== TEMPORAL band ===== -->
  <!-- Forward propagation lane (upper) -->
  <g id="forward-path">
    <rect x="270" y="310" width="210" height="70" rx="8" ry="8"
          fill="#F2F4F7" stroke="#B0B7C3" stroke-width="2"/>
    <text x="375" y="340" text-anchor="middle" font-size="14" fill="#1E2634" font-weight="600">Forward propagation</text>
    <text x="375" y="358" text-anchor="middle" font-size="10" fill="#6B7280" font-style="italic">Mamba fwd_resblocks · feat_prop</text>
  </g>

  <!-- Backward propagation lane (lower) -->
  <g id="backward-path">
    <rect x="270" y="395" width="210" height="70" rx="8" ry="8"
          fill="#F2F4F7" stroke="#B0B7C3" stroke-width="2"/>
    <text x="375" y="425" text-anchor="middle" font-size="14" fill="#1E2634" font-weight="600">Backward propagation</text>
    <text x="375" y="443" text-anchor="middle" font-size="10" fill="#6B7280" font-style="italic">Mamba bwd_resblocks · feat_prop</text>
  </g>

  <!-- Bidirectional link between forward/backward -->
  <line x1="375" y1="380" x2="375" y2="395" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="385" y="390" font-size="10" fill="#6B7280" font-style="italic">bidir</text>

  <!-- ===== MGFE blocks (novel primary) at forward/backward outputs ===== -->
  <g id="mgfe-forward">
    <rect x="550" y="310" width="170" height="70" rx="10" ry="10"
          fill="#FFE6D2" stroke="#FF8A3D" stroke-width="3"/>
    <text x="635" y="338" text-anchor="middle" font-size="15" fill="#7A3E10" font-weight="700">MGFE</text>
    <text x="635" y="358" text-anchor="middle" font-size="10" fill="#7A3E10">fwd restoration token head</text>
    <text x="635" y="372" text-anchor="middle" font-size="9" fill="#7A3E10" font-style="italic">tokens × branches (A3: 12×3)</text>
  </g>
  <g id="mgfe-backward">
    <rect x="550" y="395" width="170" height="70" rx="10" ry="10"
          fill="#FFE6D2" stroke="#FF8A3D" stroke-width="3"/>
    <text x="635" y="423" text-anchor="middle" font-size="15" fill="#7A3E10" font-weight="700">MGFE</text>
    <text x="635" y="443" text-anchor="middle" font-size="10" fill="#7A3E10">bwd restoration token head</text>
    <text x="635" y="457" text-anchor="middle" font-size="9" fill="#7A3E10" font-style="italic">tokens × branches (A3: 12×3)</text>
  </g>

  <!-- Novel-marker badge -->
  <g id="mgfe-badge">
    <rect x="720" y="305" width="92" height="22" rx="6" ry="6" fill="#FF8A3D"/>
    <text x="766" y="321" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="700">novel primary</text>
  </g>

  <!-- ===== Branch cluster (fine / mid / coarse) ===== -->
  <g id="branch-cue">
    <rect x="820" y="310" width="150" height="155" rx="10" ry="10"
          fill="#FDF2E9" stroke="#FF8A3D" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="895" y="330" text-anchor="middle" font-size="12" fill="#7A3E10" font-weight="600">Granularity branches</text>

    <rect x="835" y="340" width="120" height="28" rx="4" ry="4" fill="#FFE6D2" stroke="#FF8A3D"/>
    <text x="895" y="358" text-anchor="middle" font-size="11" fill="#7A3E10">fine (coarse tokens)</text>

    <rect x="835" y="374" width="120" height="28" rx="4" ry="4" fill="#FFD7B8" stroke="#FF8A3D"/>
    <text x="895" y="392" text-anchor="middle" font-size="11" fill="#7A3E10">medium</text>

    <rect x="835" y="408" width="120" height="28" rx="4" ry="4" fill="#FFC297" stroke="#FF8A3D"/>
    <text x="895" y="426" text-anchor="middle" font-size="11" fill="#7A3E10">coarse</text>

    <text x="895" y="452" text-anchor="middle" font-size="9" fill="#6B7280" font-style="italic">(G1=1, G2=2, A3=3 branches)</text>
  </g>

  <!-- ===== RATR auxiliary loss (dashed, training only) ===== -->
  <g id="ratr-path">
    <rect x="470" y="540" width="330" height="75" rx="10" ry="10"
          fill="#FCE7E7" stroke="#E95A5A" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="635" y="570" text-anchor="middle" font-size="15" fill="#8B2E2E" font-weight="700">
      RATR loss (training only)
    </text>
    <text x="635" y="590" text-anchor="middle" font-size="10" fill="#8B2E2E">
      differentiable Kendall's Tau · intra/inter branch ranking
    </text>
    <text x="635" y="606" text-anchor="middle" font-size="9" fill="#8B2E2E" font-style="italic">
      active in A2 / A3 / G1 / G2 · disabled at inference
    </text>
  </g>

  <!-- ===== Reconstruction head ===== -->
  <g id="recon-head">
    <rect x="1010" y="310" width="160" height="155" rx="10" ry="10"
          fill="#F2F4F7" stroke="#B0B7C3" stroke-width="2"/>
    <text x="1090" y="345" text-anchor="middle" font-size="14" fill="#1E2634" font-weight="600">Recon head</text>
    <text x="1090" y="365" text-anchor="middle" font-size="10" fill="#4B5666">upsample · conv</text>
    <text x="1090" y="383" text-anchor="middle" font-size="10" fill="#4B5666">(B, T, C, H, W)</text>
    <text x="1090" y="410" text-anchor="middle" font-size="10" fill="#6B7280" font-style="italic">baseline head</text>
    <text x="1090" y="430" text-anchor="middle" font-size="10" fill="#6B7280" font-style="italic">(carry-over)</text>
  </g>

  <!-- ===== OUTPUT strip (right) ===== -->
  <g id="output-group">
    <rect x="1200" y="310" width="60" height="155" rx="10" ry="10"
          fill="#E9F5ED" stroke="#57B26A" stroke-width="2"/>
    <!-- three restored mini frames stacked -->
    <rect x="1210" y="322" width="40" height="38" fill="#B9DDC5" stroke="#57B26A"/>
    <rect x="1210" y="368" width="40" height="38" fill="#A5D2B3" stroke="#57B26A"/>
    <rect x="1210" y="414" width="40" height="38" fill="#B9DDC5" stroke="#57B26A"/>
    <text x="1230" y="478" text-anchor="middle" font-size="11" fill="#1E2634" font-weight="600">Restored</text>
    <text x="1230" y="492" text-anchor="middle" font-size="10" fill="#4B5666">output</text>
  </g>

  <!-- ===== ARROWS (main_flow, solid) ===== -->
  <!-- input -> spatial SSM -->
  <path d="M 190,330 C 230,330 230,155 290,155"
        stroke="#2F3A4A" stroke-width="2" fill="none" marker-end="url(#arrow-solid)"/>
  <!-- input -> RAFT flow -->
  <path d="M 190,370 L 230,260"
        stroke="#2F3A4A" stroke-width="2" fill="none" marker-end="url(#arrow-solid)"/>
  <!-- RAFT flow -> forward -->
  <path d="M 295,290 C 295,310 270,310 270,330"
        stroke="#2F3A4A" stroke-width="2" fill="none" marker-end="url(#arrow-solid)"/>
  <!-- RAFT flow -> backward -->
  <path d="M 320,290 C 320,380 270,395 270,420"
        stroke="#2F3A4A" stroke-width="2" fill="none" marker-end="url(#arrow-solid)"/>
  <!-- spatial SSM feeds forward path (carry-over feature) -->
  <path d="M 390,200 C 390,260 300,260 300,310"
        stroke="#2F3A4A" stroke-width="2" fill="none" marker-end="url(#arrow-solid)"/>
  <!-- forward path -> MGFE forward -->
  <line x1="480" y1="345" x2="550" y2="345"
        stroke="#2F3A4A" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <!-- backward path -> MGFE backward -->
  <line x1="480" y1="430" x2="550" y2="430"
        stroke="#2F3A4A" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <!-- MGFE fwd -> branch cluster -->
  <line x1="720" y1="345" x2="820" y2="370"
        stroke="#2F3A4A" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <!-- MGFE bwd -> branch cluster -->
  <line x1="720" y1="430" x2="820" y2="410"
        stroke="#2F3A4A" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <!-- branch cluster -> recon head -->
  <line x1="970" y1="388" x2="1010" y2="388"
        stroke="#2F3A4A" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <!-- recon head -> output -->
  <line x1="1170" y1="388" x2="1200" y2="388"
        stroke="#2F3A4A" stroke-width="2" marker-end="url(#arrow-solid)"/>

  <!-- ===== ARROWS (training-only, dashed, red) ===== -->
  <!-- branch cluster -> RATR (training) -->
  <path d="M 895,465 C 895,520 800,540 800,577"
        stroke="#E95A5A" stroke-width="2" stroke-dasharray="6,4" fill="none"
        marker-end="url(#arrow-dashed)"/>
  <!-- MGFE fwd/bwd branch features also feed RATR (conceptual) -->
  <path d="M 635,465 C 635,500 580,515 580,540"
        stroke="#E95A5A" stroke-width="2" stroke-dasharray="6,4" fill="none"
        marker-end="url(#arrow-dashed)"/>
  <text x="520" y="525" font-size="10" fill="#8B2E2E" font-style="italic">branch features</text>

  <!-- ===== Legend ===== -->
  <g id="legend" transform="translate(60, 640)">
    <rect x="0" y="0" width="1160" height="64" rx="6" ry="6" fill="#F7F8FA" stroke="#D0D5DD"/>

    <rect x="14" y="18" width="18" height="12" fill="#F2F4F7" stroke="#B0B7C3"/>
    <text x="40" y="29" font-size="11" fill="#1E2634">baseline carry-over (MambaOFRNet)</text>

    <rect x="260" y="18" width="18" height="12" fill="#FFE6D2" stroke="#FF8A3D" stroke-width="2"/>
    <text x="286" y="29" font-size="11" fill="#1E2634">MGFE  novel primary (slot s2_spatial)</text>

    <rect x="555" y="18" width="18" height="12" fill="#FCE7E7" stroke="#E95A5A" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="580" y="29" font-size="11" fill="#1E2634">RATR  novel secondary, training-only (slot s5_reconstruction)</text>

    <line x1="14" y1="50" x2="50" y2="50" stroke="#2F3A4A" stroke-width="2" marker-end="url(#arrow-solid)"/>
    <text x="58" y="54" font-size="11" fill="#1E2634">main flow</text>

    <line x1="260" y1="50" x2="296" y2="50" stroke="#E95A5A" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-dashed)"/>
    <text x="304" y="54" font-size="11" fill="#1E2634">training-only auxiliary flow</text>

    <text x="555" y="54" font-size="11" fill="#6B7280" font-style="italic">
      Ablation variants: A0=baseline · A1=+MGFE · A2=+RATR · A3=full (12t/3b) · G1 (4t/1b) · G2 (8t/2b)
    </text>
  </g>
</svg>
