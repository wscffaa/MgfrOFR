- id: reidmamba_mgfe
  name: Multi-Granularity Feature Extractor (MGFE)
  slot: spatial
  mount_point: S2 fwd/bwd_resblocks output
  strategy: 多粒度 restoration token 分支头，将 feat_prop 展平为 token 序列后引入分支描述向量进行 channel-wise 特征重标定（recalibration）
- id: reidmamba_ratr
  name: Ranking-Aware Triplet Regularization (RATR)
  slot: reconstruction
  mount_point: 训练期附加损失
  strategy: 训练期 ranking-aware 正则损失，对多分支描述子施加可微 Kendall's Tau（intra/inter）排序相关性约束，抑制分支间冗余的时序相似度排序；仅训练期启用
